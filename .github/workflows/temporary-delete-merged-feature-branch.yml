name: Temporary feature branch cleanup
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  remove-merged-feature-branch:
    if: github.event.head_commit.message == 'Temporary cleanup to retain only main'
    runs-on: ubuntu-latest
    steps:
      - name: Delete the merged feature branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request DELETE \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GH_REPOSITORY}/git/refs/heads/fix/member-payment-session-guard"
